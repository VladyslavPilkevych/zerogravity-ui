name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 20

jobs:
    static:
        name: Static quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm format:check
            - run: pnpm typecheck

    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test

    package:
        name: Library build and package validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build:lib
            - run: pnpm check:package

    consumer:
        name: Packaged consumer tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test:consumer

    playground:
        name: Next.js playground build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: actions/upload-artifact@v4
              with:
                  name: next-build
                  path: .next
                  retention-days: 1

    browser:
        name: Storybook browser and accessibility tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install chromium --with-deps
            - run: pnpm test:browser
            - run: pnpm build-storybook
            - uses: actions/upload-artifact@v4
              with:
                  name: storybook-static
                  path: storybook-static
                  retention-days: 1

    e2e:
        name: Playwright smoke tests
        runs-on: ubuntu-latest
        needs: playground
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: next-build
                  path: .next
            - run: pnpm exec playwright install chromium --with-deps
            - run: pnpm test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report
                  retention-days: 7

    visual:
        name: Chromatic visual review
        runs-on: ubuntu-latest
        needs: browser
        if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        env:
            CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/download-artifact@v4
              with:
                  name: storybook-static
                  path: storybook-static
            - name: Publish to Chromatic
              if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
              run: pnpm exec chromatic --storybook-build-dir storybook-static

            - name: Report missing Chromatic token
              if: ${{ env.CHROMATIC_PROJECT_TOKEN == '' }}
              run: echo "CHROMATIC_PROJECT_TOKEN secret is not configured; skipping visual review."

    security:
        name: Dependency audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --audit-level high
